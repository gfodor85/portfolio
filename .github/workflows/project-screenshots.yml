name: Capture project screenshots

on:
  push:
    branches:
      - master
    paths:
      - index.html
      - .github/workflows/project-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture project pages
        run: |
          mkdir -p assets/img
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const projects = [
              { name: 'azulite', url: 'https://gfodor85.github.io/Azulite/' },
              { name: 'verdina', url: 'https://gfodor85.github.io/verdina/' },
              { name: 'dentico', url: 'https://gfodor85.github.io/dentico/' },
            ];

            for (const project of projects) {
              const page = await browser.newPage({
                viewport: { width: 1200, height: 800 },
                deviceScaleFactor: 1,
              });
              await page.goto(project.url, {
                waitUntil: 'networkidle',
                timeout: 60000,
              });
              await page.evaluate(() => document.fonts.ready);
              await page.waitForTimeout(1200);
              await page.screenshot({
                path: `assets/img/${project.name}.png`,
                type: 'png',
              });
              await page.close();
              console.log(`Captured ${project.name}`);
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit screenshots
        run: |
          if git status --short -- assets/img/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/img/azulite.png assets/img/verdina.png assets/img/dentico.png
            git commit -m "Update local project screenshots"
            git push origin master
          else
            echo "Project screenshots are already up to date."
          fi
